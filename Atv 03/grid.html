<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercícios Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="conteudo">
      <h1>Exercícios Grid</h1>
    </div>
  </header>

  <main class="conteudo">
    <section class="exercicio">
      <h2>Colunas</h2>
      <div class="demo">
        <div class="g1">
          <div class="caixa">1</div><div class="caixa">2</div><div class="caixa">3</div>
          <div class="caixa">4</div><div class="caixa">5</div><div class="caixa">6</div>
        </div>
      </div>
    </section>

    <section class="exercicio">
      <h2>Espaçamento Gap</h2>
      <div class="demo">
        <div class="g2">
          <div class="caixa">1</div><div class="caixa">2</div><div class="caixa">3</div>
          <div class="caixa">4</div><div class="caixa">5</div><div class="caixa">6</div>
        </div>
      </div>
    </section>

    <section class="exercicio">
      <h2>Itens nas células</h2>
      <div class="demo">
        <div class="g3">
          <div class="caixa largo">1 (2 colunas)</div>
          <div class="caixa">2</div>
          <div class="caixa alto">3 (2 linhas)</div>
          <div class="caixa">4</div><div class="caixa">5</div><div class="caixa">6</div>
        </div>
      </div>
    </section>

    <section class="exercicio">
      <h2>Areas nomeadas</h2>
      <div class="demo">
        <div class="g4">
          <div class="caixa a-topo">Topo</div>
          <div class="caixa a-lateral alta">Lateral</div>
          <div class="caixa a-principal alta">Principal</div>
          <div class="caixa a-rodape">Rodapé</div>
        </div>
      </div>
    </section>

    <section class="exercicio">
      <h2>Grid Responsiva</h2>
      <div class="demo">
        <div class="g5">
          <div class="caixa">1</div><div class="caixa">2</div><div class="caixa">3</div>
          <div class="caixa">4</div><div class="caixa">5</div><div class="caixa">6</div>
          <div class="caixa">7</div><div class="caixa">8</div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <a href="index.html">Página principal</a>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercícios de Forms</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="conteudo">
      <h1>1. Exercício Forms</h1>
    </div>
  </header>

  <main class="conteudo">

    <section class="exercicio">
      <h2>Campos de texto</h2>

      <div class="demo">
        <form class="form" action="#" onsubmit="return false">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@exemplo.com">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha">
          <label for="nasc">Data de nascimento</label>
          <input type="date" id="nasc" name="nasc">
        </form>
      </div>
    </section>

    <section class="exercicio">
      <h2>Radio e Checkbox</h2>
      <div class="demo">
        <form class="form" action="#" onsubmit="return false">
          <fieldset>
            <legend>Turno</legend>
            <div class="opcao"><input type="radio" id="manha" name="turno" value="manha" checked><label for="manha">Manhã</label></div>
            <div class="opcao"><input type="radio" id="tarde" name="turno" value="tarde"><label for="tarde">Tarde</label></div>
            <div class="opcao"><input type="radio" id="noite" name="turno" value="noite"><label for="noite">Noite</label></div>
          </fieldset>
          <fieldset>
            <legend>Interesses</legend>
            <div class="opcao"><input type="checkbox" id="dev" name="interesse" value="dev"><label for="dev">Desenvolvimento</label></div>
            <div class="opcao"><input type="checkbox" id="dados" name="interesse" value="dados"><label for="dados">Análise de dados</label></div>
            <div class="opcao"><input type="checkbox" id="redes" name="interesse" value="redes"><label for="redes">Redes</label></div>
          </fieldset>
        </form>
      </div>


    <section class="exercicio">
      <h2>Select e Text area</h2>
      <div class="demo">
        <form class="form" action="#" onsubmit="return false">
          <label for="curso">Curso</label>
          <select id="curso" name="curso">
            <option value="si">Sistemas de Informação</option>
            <option value="ads">Análise e Desenvolvimento de Sistemas</option>
            <option value="info">Informática</option>
          </select>
          <label for="msg">Mensagem</label>
          <textarea id="msg" name="msg" rows="4" placeholder="Escreva aqui"></textarea>
        </form>
      </div>
    </section>

    <section class="exercicio">
      <h2>Formulário Teste</h2>
      <p>Juntando tudo, com campos obrigatórios e botões de enviar e limpar.</p>
      <div class="demo">
        <form class="form" action="#" onsubmit="alert('Formulário enviado!'); return false;">
          <label for="f-nome">Nome completo</label>
          <input type="text" id="f-nome" name="nome" required>
          <label for="f-email">E-mail</label>
          <input type="email" id="f-email" name="email" required>
          <fieldset>
            <legend>Como prefere ser contatado?</legend>
            <div class="opcao"><input type="radio" id="c-email" name="contato" value="email" checked><label for="c-email">E-mail</label></div>
            <div class="opcao"><input type="radio" id="c-tel" name="contato" value="tel"><label for="c-tel">Telefone</label></div>
          </fieldset>
          <div class="opcao termos">
            <input type="checkbox" id="aceito" name="aceito" required>
            <label for="aceito">Li e aceito os termos</label>
          </div>
          <button type="submit">Enviar</button>
          <button type="reset">Limpar</button>
        </form>
      </div>
    </section>
</main>

  <footer>
    <a href="index.html">Página principal</a>
  </footer>

</body>
</html>
